spring.application.name=eduflow-test
# H2 is test-only; the running application uses MySQL.
spring.datasource.url=jdbc:h2:mem:eduflow-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Test-only signing key. Never use this value outside tests.
app.jwt.secret=dGVzdC1vbmx5LXNlY3JldC1rZXktMzItYnl0ZXMtbG9uZyE=
app.jwt.expiration-seconds=3600
app.assignments.storage-dir=${java.io.tmpdir}/eduflow-isolated-tests-${random.uuid}
app.exams.expiry-enabled=false
app.notifications.scheduler-enabled=false
