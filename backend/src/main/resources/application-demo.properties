# This profile never inherits the normal DB_* connection or schema-update mode.
spring.datasource.url=${DEMO_DB_URL}
spring.datasource.username=${DEMO_DB_USERNAME}
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
server.address=127.0.0.1
server.port=${DEMO_SERVER_PORT:18084}
app.assignments.storage-dir=${DEMO_STORAGE_DIR}
app.notifications.scheduler-enabled=false
app.exams.expiry-enabled=false
eduflow.demo.seed.enabled=${DEMO_SEED_ENABLED:false}
eduflow.demo.seed.confirm=${DEMO_SEED_CONFIRM:}
eduflow.demo.seed.exit-after-run=${DEMO_SEED_EXIT:true}
eduflow.demo.report-path=${DEMO_REPORT_PATH:}
