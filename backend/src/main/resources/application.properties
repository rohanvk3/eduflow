spring.application.name=eduflow

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Development: create/update entity tables when the application starts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Base64 encoded random key, containing at least 32 decoded bytes.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
